<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart - MobileHub</title>
  <!-- Relative stylesheet link for GitHub Pages compatibility -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <h1>📱 MobileHub</h1>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li>
          <a href="cart.html" class="active" title="View Cart">
            🛒 Cart <span id="cart-count" class="cart-badge">0</span>
          </a>
        </li>
        <li id="nav-auth-slot"><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- Cart Content Container -->
  <main class="container">
    <div class="section-header">
      <h2>Shopping Cart</h2>
      <a href="products.html" class="view-all">&larr; Continue Shopping</a>
    </div>

    <div id="cart-content">
      <!-- Injected by JavaScript based on cart state -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MobileHub - Student Industrial Training Project</p>
    <div class="footer-status">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connecting to backend...</span>
    </div>
  </footer>

  <!-- Scripts (Relative paths) -->
  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Render the shopping cart view
    function renderCartPage() {
      const container = document.getElementById('cart-content');
      const cart = getCart();

      // If cart is empty
      if (!cart || cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-container">
            <div class="empty-icon">🛒</div>
            <h3>Your Cart is Currently Empty</h3>
            <p>You haven't added any smartphones to your cart yet.</p>
            <a href="products.html" class="btn-hero" style="display: inline-block;">Browse Phones Catalog</a>
          </div>
        `;
        return;
      }

      const total = getCartTotal();

      container.innerHTML = `
        <div class="cart-layout">
          <!-- Cart Items Table -->
          <div class="cart-card">
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th style="text-align: center;">Quantity</th>
                  <th>Subtotal</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${cart.map(item => `
                  <tr>
                    <td>
                      <div class="cart-item-info">
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                          <div class="cart-item-brand">${item.brand}</div>
                          <a href="product.html?id=${item.id}" class="cart-item-title" style="text-decoration:none;">
                            ${item.name}
                          </a>
                        </div>
                      </div>
                    </td>
                    <td>${formatPrice(item.price)}</td>
                    <td style="text-align: center;">
                      <div class="qty-control" style="margin: 0 auto;">
                        <button type="button" class="qty-btn" onclick="handleQtyChange(${item.id}, ${item.quantity - 1})">-</button>
                        <input type="text" class="qty-input" value="${item.quantity}" readonly>
                        <button type="button" class="qty-btn" onclick="handleQtyChange(${item.id}, ${item.quantity + 1})">+</button>
                      </div>
                    </td>
                    <td style="font-weight: 600; color: #1e3a8a;">
                      ${formatPrice(item.price * item.quantity)}
                    </td>
                    <td>
                      <button class="btn-remove-item" onclick="handleRemoveItem(${item.id})">
                        Remove
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Order Summary Card -->
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
              <span>Items Total (${getCartItemCount()} items):</span>
              <span>${formatPrice(total)}</span>
            </div>
            <div class="summary-row">
              <span>Delivery Charges:</span>
              <span style="color: #16a34a; font-weight: 600;">FREE</span>
            </div>
            <div class="summary-row total-row">
              <span>Grand Total:</span>
              <span>${formatPrice(total)}</span>
            </div>

            <button class="btn-checkout" onclick="proceedToCheckout()">
              Proceed to Checkout &rarr;
            </button>

            <button class="btn-clear-cart" onclick="handleClearCart()">
              Clear Entire Cart
            </button>
          </div>
        </div>
      `;
    }

    // Change item quantity and re-render
    function handleQtyChange(productId, newQty) {
      updateQuantity(productId, newQty);
      renderCartPage();
    }

    // Remove item and re-render
    function handleRemoveItem(productId) {
      removeFromCart(productId);
      renderCartPage();
    }

    // Clear cart and re-render
    function handleClearCart() {
      if (confirm('Are you sure you want to remove all items from your cart?')) {
        clearCart();
        renderCartPage();
      }
    }

    // Checkout button action
    function proceedToCheckout() {
      const cart = getCart();
      if (!cart || cart.length === 0) {
        alert('Your cart is currently empty! Please add some phones first.');
        return;
      }

      if (!isLoggedIn()) {
        alert('Please login to proceed to checkout!');
        window.location.href = 'login.html';
        return;
      }

      window.location.href = 'checkout.html';
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
